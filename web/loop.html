<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocinante · Torpedo bay</title>
  <link rel="stylesheet" href="loop.css">
</head>
<body>
  <div id="canvas" aria-label="The Rocinante in space"></div>
  <div id="scene-error" role="alert" hidden></div>

  <aside id="sidebar" class="panel">
    <section id="deck-detail" hidden aria-label="Deck details">
      <button id="all-decks" class="quiet sidebar-back" type="button">← Back to ship</button>
      <span class="eyebrow" id="deck-number"></span>
      <h2 id="deck-title"></h2>
      <p id="deck-description"></p>
      <span id="deck-crew"></span>
    </section>
    <section id="launch-hud" hidden aria-label="Torpedo training launch">
      <button id="cancel-launch" class="quiet sidebar-back" type="button">← Cancel launch</button>
      <span class="eyebrow">TORPEDO / TRAINING EXERCISE</span>
      <h2 id="launch-phase" role="status" aria-live="polite"></h2>
      <p id="launch-caption">OpenRocket atmospheric ascent · fictional target in space</p>
      <p id="launch-desktop" role="status"></p>
      <div id="launch-telemetry"><span id="launch-time">T+ 0.00 s</span><span id="launch-speed">0 m/s</span><span id="launch-range">Target acquiring</span></div>
      <details id="flight-details"><summary>Flight results</summary><p id="flight-results"></p><p id="flight-warnings"></p></details>
    </section>
    <section id="workshop-page" aria-label="Torpedo workshop">
      <form id="proposal">
        <div class="workshop-heading">
          <button id="clear-selection" class="quiet back-button" type="button" aria-label="Back" title="Back" hidden>←</button>
          <label for="ask" class="eyebrow"><span id="workshop-title">General workshop</span></label>
        </div>
        <p id="workshop-scope" class="form-intro">Select a loaded torpedo to edit it.</p>
        <select id="preset" aria-label="Fixture refit" hidden></select>
        <textarea id="ask" rows="3" maxlength="2000" placeholder="Tell Astra how to equip the Roci with torpedoes…" aria-label="Refit request"></textarea>
        <div id="samples" class="chips" aria-label="Sample requests"></div>
        <button id="propose" type="submit">Ask gpt-6-astra</button>
        <p id="selection-sync" role="status" aria-live="polite"></p>
      </form>
      <p id="status" role="status" aria-live="polite">Loading the ship…</p>
    </section>
  </aside>
  <button id="presentation" class="sidebar-toggle" type="button" aria-pressed="false" aria-label="Collapse sidebar" title="Collapse sidebar"><span id="sidebar-toggle-icon" aria-hidden="true">‹</span></button>

  <div class="controls">
    <label><input id="ghost" type="checkbox"> Previous hull</label>
    <label><input id="highlight" type="checkbox" checked> Changes</label>
    <label><input id="rotate" type="checkbox"> Rotate</label>
    <button id="fit" type="button">Reset view</button>
    <span id="geometry-source"></span>
    <a href="/interior-references" target="_blank" rel="noopener noreferrer">Design references ↗</a>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
  <script type="module" src="loop.js"></script>
</body>
</html>
