<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocinante · Torpedo bay</title>
  <link rel="stylesheet" href="loop.css">
</head>
<body>
  <div id="canvas" aria-label="The Rocinante in space"></div>
  <div id="scene-error" role="alert" hidden></div>

  <header class="hud">
    <div><h1 id="title">Rocinante</h1><p id="comparison"></p></div>
    <div class="header-actions"><span id="mode" class="badge">Connecting</span>
    <button id="presentation" class="quiet" type="button" aria-pressed="false">Presentation mode</button></div>
  </header>

  <section class="explore" aria-label="Ship exploration">
    <button id="disassemble" type="button" aria-pressed="false" disabled><span class="explode-icon" aria-hidden="true">▱</span> Disassemble Roci</button>
  </section>
  <div id="deck-detail" hidden><span class="eyebrow" id="deck-number"></span><h2 id="deck-title"></h2><p id="deck-description"></p><span id="deck-crew"></span><button id="all-decks" class="quiet" type="button">← All decks</button></div>
  <aside class="panel">
    <form id="proposal">
      <label for="ask" class="eyebrow">Torpedo workshop</label>
      <select id="preset" aria-label="Fixture refit" hidden></select>
      <textarea id="ask" rows="3" maxlength="2000" placeholder="Tell Astra how to equip the Roci with torpedoes…" aria-label="Refit request"></textarea>
      <div id="samples" class="chips" aria-label="Sample requests"></div>
      <button id="propose" type="submit">Ask Astra →</button>
    </form>
    <p id="status" role="status" aria-live="polite">Loading the ship…</p>

    <ol id="progress" aria-label="Propagation">
      <li data-step="astra"><span>Astra</span><em></em></li>
      <li data-step="physics"><span>Physics</span><em></em></li>
      <li data-step="blender"><span>Blender</span><em></em></li>
      <li data-step="openrocket"><span>OpenRocket</span><em></em></li>
      <li data-step="kord"><span>Kord</span><em></em><a id="kord-link" target="_blank" rel="noopener noreferrer" hidden>open ↗</a></li>
    </ol>
    <p id="rationale"></p>

    <h3>Torpedo <span>in OpenRocket</span></h3>
    <dl id="torpedo"></dl>
    <h3>Ship <span>computed from the spec</span></h3>
    <dl id="metrics"></dl>
    <h3>Spec changes</h3><ul id="changes"></ul>
  </aside>

  <div class="controls">
    <label><input id="ghost" type="checkbox"> Previous hull</label>
    <label><input id="highlight" type="checkbox" checked> Changes</label>
    <label><input id="rotate" type="checkbox"> Rotate</label>
    <button id="fit" type="button">Reset view</button>
    <span id="geometry-source"></span>
    <a href="/interior-references" target="_blank" rel="noopener noreferrer">Design references ↗</a>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
  <script type="module" src="loop.js"></script>
</body>
</html>
